<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthCounty Bank</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="bank-container" style="display: none;">
        <div class="bank-wrapper">
            <!-- Header -->
            <div class="bank-header">
                <div class="bank-logo">
                    <span class="logo-icon">🏦</span>
                    <h1 id="server-name">NorthCounty Bank</h1>
                </div>
                <button class="close-btn" onclick="closeBank()">✕</button>
            </div>

            <!-- Main Content -->
            <div class="bank-content">
                <!-- Sidebar -->
                <div class="sidebar">
                    <div class="account-info">
                        <div class="account-label">Titulaire du compte</div>
                        <div class="account-name" id="account-name">Chargement...</div>
                        <div class="balance-display">
                            <div class="balance-label">Solde bancaire</div>
                            <div class="balance-amount" id="balance-amount">$0</div>
                        </div>
                        <div class="cash-display">
                            <div class="cash-label">Espèces</div>
                            <div class="cash-amount" id="cash-amount">$0</div>
                        </div>
                    </div>

                    <nav class="nav-menu">
                        <button class="nav-item active" data-section="operations">
                            <span class="nav-icon">💰</span>
                            Opérations
                        </button>
                        <button class="nav-item" data-section="transfer">
                            <span class="nav-icon">💸</span>
                            Virements
                        </button>
                        <button class="nav-item" data-section="savings">
                            <span class="nav-icon">🏦</span>
                            Épargne
                        </button>
                        <button class="nav-item" data-section="history">
                            <span class="nav-icon">📊</span>
                            Historique
                        </button>
                    </nav>
                </div>

                <!-- Content Area -->
                <div class="content-area">
                    <!-- Operations Section -->
                    <div class="section active" id="operations-section">
                        <h2>Opérations bancaires</h2>
                        <div class="operations-grid">
                            <div class="operation-card">
                                <div class="operation-icon">📥</div>
                                <h3>Déposer de l'argent</h3>
                                <input type="number" id="deposit-amount" placeholder="Montant" min="0">
                                <button class="btn btn-primary" onclick="deposit()">Déposer</button>
                            </div>

                            <div class="operation-card">
                                <div class="operation-icon">📤</div>
                                <h3>Retirer de l'argent</h3>
                                <input type="number" id="withdraw-amount" placeholder="Montant" min="0">
                                <button class="btn btn-danger" onclick="withdraw()">Retirer</button>
                            </div>
                        </div>
                    </div>

                    <!-- Transfer Section -->
                    <div class="section" id="transfer-section">
                        <h2>Effectuer un virement</h2>
                        <div class="transfer-container">
                            <div class="form-group">
                                <label>Sélectionner le bénéficiaire</label>
                                <select id="transfer-target" class="form-control">
                                    <option value="">Chargement des joueurs...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Montant</label>
                                <input type="number" id="transfer-amount" class="form-control" placeholder="Montant à transférer" min="0">
                            </div>
                            <div class="transfer-info">
                                <p>⚠️ Des frais de 2% seront appliqués sur ce virement</p>
                            </div>
                            <button class="btn btn-primary btn-large" onclick="transfer()">Effectuer le virement</button>
                        </div>
                    </div>

                    <!-- Savings Section -->
                    <div class="section" id="savings-section">
                        <h2>Comptes d'épargne</h2>
                        <button class="btn btn-success" onclick="createSavingsAccount()">+ Créer un compte d'épargne</button>
                        <div id="savings-list" class="savings-list">
                            <!-- Savings accounts will be loaded here -->
                        </div>
                    </div>

                    <!-- History Section -->
                    <div class="section" id="history-section">
                        <h2>Historique des transactions</h2>
                        <button class="btn btn-secondary" onclick="refreshHistory()">🔄 Actualiser</button>
                        <div class="transactions-list" id="transactions-list">
                            <!-- Transactions will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
